# Bench Pi (Pi 5 + I350, eth4): the AAF devices matching the board's
# (Phase 9, P9.6; docs/phase9_status_2026-09-26.md sec. 6.12). The mirror of
# what avb_net.py generates on the board from yocto/.../fpgamixer-avb/files/
# avb.conf: the Pi's avb_tx is the board's avb_rx and the other way round.
# Keep the two in step by hand (bench only).
#
# Install on the Pi as /etc/asound.conf (needs the AAF plugin, built from
# alsa-plugins 1.2.12 against Debian's libavtp, and the VLAN interface eth4.2).
# The Pi's kernel has no CBS/ETF qdiscs, so its talker is unshaped: a burst of
# PDUs per ALSA period (fine on the point-to-point cable).
#
# Stream: 8 ch S24_3BE 48000 Hz, 6 frames/PDU; the application must use
# exactly this format, and a period that is a multiple of 6 frames.

pcm.avb_tx {
    type aaf
    ifname "eth4.2"
    frames_per_pdu 6
    # Pi -> board
    addr "91:E0:F0:00:FE:01"
    streamid "50:7C:6F:8E:40:5B:0000"
    prio 3
    mtt 2000
    time_uncertainty 125
}

pcm.avb_rx {
    type aaf
    ifname "eth4.2"
    frames_per_pdu 6
    # board -> Pi
    addr "91:E0:F0:00:FE:00"
    streamid "00:18:3E:05:06:48:0000"
    ptime_tolerance 125
}
