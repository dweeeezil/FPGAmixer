# meta-fpgamixer: board fixes and application recipes for the FPGAmixer on
# the Digilent Genesys ZU-3EG, on top of AMD EDF 26.06.1.
#
# Lives in the FPGAmixer repo (yocto/meta-fpgamixer). scripts/sync_buildhost.sh
# copies the repo's yocto/ AND tools/ to the build VM, keeping their relative
# layout (~/edf/2026.1/sources/fpgamixer/{yocto,tools}), and bblayers.conf
# points at that copy of this layer. Recipes that package board software take
# it straight from the repo's tools/ via FPGAMIXER_TOOLS, so there is one
# source of truth and never a second copy inside the layer.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "fpgamixer"
BBFILE_PATTERN_fpgamixer = "^${LAYERDIR}/"
BBFILE_PRIORITY_fpgamixer = "10"

LAYERDEPENDS_fpgamixer = "core"
LAYERSERIES_COMPAT_fpgamixer = "scarthgap"

# The repo's tools/ directory (board-side Python), relative to this layer.
FPGAMIXER_TOOLS := "${LAYERDIR}/../../tools"

# 1 = also install the bench network config (end0 = 10.0.0.2/24 for the Pi
# gPTP link, plus DHCP). Set FPGAMIXER_BENCH = "0" in local.conf for a build
# that shouldn't carry lab addressing.
FPGAMIXER_BENCH ??= "1"
