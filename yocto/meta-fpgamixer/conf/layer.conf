# meta-fpgamixer: board fixes and (later) application recipes for the
# FPGAmixer on the Digilent Genesys ZU-3EG, on top of AMD EDF 26.06.1.
# Lives in the FPGAmixer repo (yocto/meta-fpgamixer) and is synced to the
# build VM at ~/edf/2026.1/sources/meta-fpgamixer.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "fpgamixer"
BBFILE_PATTERN_fpgamixer = "^${LAYERDIR}/"
BBFILE_PRIORITY_fpgamixer = "10"

LAYERDEPENDS_fpgamixer = "core"
LAYERSERIES_COMPAT_fpgamixer = "scarthgap"
