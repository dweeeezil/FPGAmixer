# FPGAmixer: AVB class A shaping on end0 (Phase 9, P9.6, decision A1).
# docs/phase9_status_2026-09-26.md sec. 6.12.
#
# mqprio is already built in (checked: modules.builtin on the board). CBS
# shapes the class A queue, and ETF releases each AAF PDU at its SO_TXTIME
# launch time, which the alsa-plugins AAF talker relies on. Both run in
# software: macb enables TC offload only for configs with MACB_CAPS_TC
# (Versal), not for the ZynqMP GEM. Built in, like the USB options, so the
# boot service doesn't depend on module loading. TAPRIO is left out: AVB has
# no gate schedule. (AMD's meta-xilinx-tsn tsn-extra.cfg has these too, with
# much else; it isn't applied to this machine.)
CONFIG_NET_SCH_CBS=y
CONFIG_NET_SCH_ETF=y
