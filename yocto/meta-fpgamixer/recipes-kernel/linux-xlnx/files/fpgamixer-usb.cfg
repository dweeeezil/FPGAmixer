# FPGAmixer: USB device mode (UAC2 soundcard on the Type-C port, PS USB0).
# docs/phase8_status_2026-09-25.md sec. 3.2.
#
# The stock EDF kernel has USB_GADGET=m with DWC3 built in, which leaves only
# DWC3's host-only mode selectable (USB_DWC3_DUAL_ROLE needs USB_GADGET=y).
# Everything is built in, so gadget setup at boot does not depend on module
# loading. Which controller is host and which is device is set per controller
# by dr_mode in system-user.dtsi (USB0 peripheral, USB1 host).
CONFIG_USB_GADGET=y
CONFIG_USB_DWC3_DUAL_ROLE=y
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_F_UAC2=y
CONFIG_USB_U_AUDIO=y
CONFIG_USB_F_UAC2=y
