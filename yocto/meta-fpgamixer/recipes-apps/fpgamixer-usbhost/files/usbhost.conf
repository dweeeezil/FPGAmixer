# FPGAmixer USB host bridge (Phase 11): which interface, which link, how.
# Read by fpgamixer-usbhost-bridge.service (EnvironmentFile).

# The interface's ALSA card id (cat /proc/asound/cards: the name in [brackets]).
USBHOST_CARD=M2

# The PS<->PL link card it is bridged to. Phase 11 H.2: link #1 (the USB
# device bridge is stopped while this runs); from H.4: hw:FPGAmixerLink3.
USBHOST_LINK=hw:FPGAmixerLink

# The interface's channels each way (the MOTU M2: 2). The link carries 8;
# the rest are zeros.
USBHOST_CHANNELS=2

# Resampler quality: fastest, medium, best (libsamplerate sinc), or linear.
# Chosen after the CPU measurement on the board (fpgamixer-rate-test --bench).
USBHOST_QUALITY=fastest
