#
# fpgamixer-gptp.cfg -- 802.1AS (gPTP) for the FPGAmixer board, used by
# fpgamixer-ptp4l.service and fpgamixer-phc2sys.service.
#
# Starts from linuxptp 4.4's configs/gPTP.cfg (the profile the 2026-09-24
# spike passed with: 3-4 ns RMS over one hop, docs/gptp_spike_2026-09-24.md),
# unchanged except where marked FPGAMIXER.
#
# ROLE (docs/phase9_status_2026-09-26.md 8.1, decision 2): chosen by the best
# master clock algorithm, not forced with slaveOnly, so the same file serves
# both roles:
#   - follower (bench, now): priority1 250 is worse than the default 248 the
#     Pi's gPTP.cfg uses, so the Pi wins while it is on the link;
#   - grandmaster (later): set priority1 below 248 here (e.g. 246), or run
#     with no better clock on the link.
# The media clock (P9.3/P9.4) locks mclk to THIS board's PHC in either role:
# as follower the PHC is steered to the grandmaster, as grandmaster it is the
# reference. So the role is purely a gPTP setting.
#
[global]
gmCapable		1
# FPGAMIXER: 248 -> 250, the board prefers to follow (see ROLE above)
priority1		250
priority2		248
logAnnounceInterval	0
logSyncInterval		-3
syncReceiptTimeout	3
neighborPropDelayThresh	800
min_neighbor_prop_delay	-20000000
assume_two_step		1
path_trace_enabled	1
follow_up_info		1
transportSpecific	0x1
ptp_dst_mac		01:80:C2:00:00:0E
network_transport	L2
delay_mechanism		P2P
#
# FPGAMIXER: logging. ptp4l logs to syslog (the journal). A follower prints
# one summary (offset rms/max, frequency, path delay) per 2^summary_interval
# seconds: 16 s, so the SD card isn't written every second while rms and max
# still cover every sample. For 1-second detail run ptp4l by hand with -m.
summary_interval	4
