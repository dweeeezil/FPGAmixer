# FPGAmixer AVB streams (Phase 9, P9.6): the one place for the AVB front
# door's network and stream parameters. Read at boot by avb_net.py
# (fpgamixer-avb-net.service), which sets up end0 and writes the ALSA devices
# avb_tx / avb_rx. Decisions A1-A8: docs/phase9_status_2026-09-26.md sec. 6.12.
# After editing: sudo systemctl restart fpgamixer-avb-net

[net]
parent = end0
; AVB default for SR class A: VLAN 2, PCP 3 (A6). The PCP is also the socket
; priority the AAF talker uses, which mqprio maps to TX queue 1.
vlan_id = 2
pcp = 3
; TAI - UTC, seconds (A3). The AAF plugin assumes 37.
tai_offset = 37
link_mbps = 1000
; Credit-based shaper reservation (A2): the stream needs 13,440 kbit/s on the
; wire in S24_3BE and 16,512 kbit/s in S32_BE (8 ch, 6 frames/PDU), which a
; controller may switch to at run time (Phase 10), while the shaper is set
; once at boot. Software CBS counts frame bytes, so it is set with headroom
; over the larger (was 16000 in P9.6, below S32_BE). avb_net.py refuses a
; value below the largest format's rate.
idleslope_kbps = 20000
; (etf_delta_us is gone: no ETF qdisc since Phase 10, see avb_net.py)

[stream]
; A4: AAF INT_24BIT, 8 channels, 48 kHz, class A (125 us per PDU)
channels = 8
format = S24_3BE
rate = 48000
frames_per_pdu = 6
mtt_us = 2000
; Launch time = the plugin's period tick + this. Was 125; 1000 since the
; Phase 10 bench, where 125 us left the (since removed) ETF qdisc dropping
; late PDUs. Without ETF the launch time isn't enforced; kept as benched.
time_uncertainty_us = 1000
ptime_tolerance_us = 125

[entity]
; avb_entityd, the AVDECC entity (Phase 10): what a controller (e.g. macOS's
; Network Device Browser) shows. The entity ID is derived from end0's MAC
; (EUI-64 with FF:FE in the middle); the model ID from its OUI.
name = FPGAmixer

[bridge]
; fpgamixer-avb-bridge, AAF devices <-> FPGAmixerLink2 (P9.7, decision V3).
; One ALSA period for both sides: a multiple of frames_per_pdu, and within the
; link card's limits (6..1600 frames, 2..6 periods). 96 frames = 2 ms.
period_frames = 96
periods = 4
; the playback queue each direction is held at, in periods (no servo, V2)
queue_periods = 2

[tx]
; board -> Pi (A5). 91:E0:F0:00:FE:xx is outside 1722's MAAP dynamic pool
; (91:E0:F0:00:00:00 - FD:FF) and its protocol address (FF:00).
addr = 91:E0:F0:00:FE:00
; stream ID = the talker's MAC (the board's end0) + unique ID 0000
streamid = 00:18:3E:05:06:48:0000

[rx]
; Pi -> board
addr = 91:E0:F0:00:FE:01
; the talker's MAC + 0000: the bench Pi's I350 eth4 (read 2026-09-28). The
; plugin's listener silently drops PDUs with any other stream ID.
streamid = 50:7C:6F:8E:40:5B:0000
