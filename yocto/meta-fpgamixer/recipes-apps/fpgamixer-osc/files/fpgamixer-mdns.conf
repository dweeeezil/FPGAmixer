# FPGAmixer: mDNS in systemd-resolved, for discovery (OSC standard,
# "Discovery"; controller contract F5). Yocto builds systemd with
# -Ddefault-mdns=no, so this turns it on globally; the link also needs
# MulticastDNS=yes in its .network (10-end0-bench.network has it).
#
# With both, the board answers as <hostname>.local (amd-edf.local) and
# publishes the services in /etc/systemd/dnssd/, where the OSC server writes
# studiorunner.dnssd (_studiorunner._tcp).
#
# Installed by fpgamixer-osc. Avahi must not run alongside (both would
# answer mDNS on port 5353); the image has none.
[Resolve]
MulticastDNS=yes
